# Install once with: uv run pre-commit install
# Ruff and mypy run through uv, so they use the versions pinned in uv.lock
# (one source of truth with CI) and mypy sees the project's real dependencies.
minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy (strict, src/claim_intake)
        entry: uv run mypy
        language: unsupported
        types: [python]
        pass_filenames: false
      - id: no-co-authored-by
        name: reject Co-Authored-By trailers
        entry: "(?i)^co-authored-by:"
        language: pygrep
        stages: [commit-msg]
